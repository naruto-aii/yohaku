<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>余白</title>
<style>
  :root {
    color-scheme: light;
    --surface: #E6E1D8;
    --page: #DDD7CD;
    --ink: #3C3832;
    --soft: #5C564E;
    --faint: #6F675E;
    --dark: #c8bfb3;
    --light: #f4f0ea;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", "Source Han Sans JP", sans-serif;
    font-weight: 400;
    font-synthesis: none;
  }

  body {
    min-height: 100vh;
    padding: 48px 24px 64px;
  }

  header {
    max-width: 34em;
    margin: 0 auto 36px;
    text-align: center;
  }

  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 400;
    letter-spacing: 0.46em;
    text-indent: 0.46em;
  }

  header p {
    margin: 14px 0 0;
    color: var(--soft);
    font-size: 14px;
    line-height: 1.9;
  }

  main {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 56px;
    flex-wrap: wrap;
  }

  figure {
    margin: 0;
  }

  figcaption {
    margin-top: 18px;
    text-align: center;
    color: var(--soft);
    font-size: 13px;
    letter-spacing: 0.22em;
    text-indent: 0.22em;
  }

  .device {
    width: 390px;
    height: 844px;
    background: var(--surface);
    border-radius: 48px;
    position: relative;
    overflow: hidden;
    box-shadow:
      18px 18px 36px #cfc6ba,
      -14px -14px 32px #f7f3ee;
  }

  .screen {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 72px 28px 36px;
  }

  .spacer { flex: 1 1 16px; }
  .spacer.top { flex: 0.7 1 12px; }

  .phase {
    margin: 0;
    font-size: 14px;
    letter-spacing: 0.28em;
    text-indent: 0.28em;
    color: var(--soft);
  }

  .time {
    margin: 18px 0 0;
    font-size: clamp(64px, 22vw, 96px);
    font-weight: 300;
    line-height: 1;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }

  .streak {
    margin-top: 22px;
    text-align: center;
  }

  .streak strong {
    display: block;
    font-size: 20px;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    color: var(--soft);
  }

  .streak span {
    display: block;
    margin-top: 4px;
    font-size: 11px;
    letter-spacing: 0.24em;
    text-indent: 0.24em;
    color: var(--soft);
  }

  .play {
    width: 104px;
    height: 104px;
    border-radius: 50%;
    background: var(--surface);
    box-shadow:
      8px 8px 16px rgba(168, 158, 144, 0.45),
      -6px -6px 14px rgba(255, 252, 248, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }

  .play i {
    width: 5px;
    height: 28px;
    border-radius: 3px;
    background: var(--ink);
    display: block;
  }

  .noises {
    display: flex;
    gap: 12px;
    width: 100%;
    justify-content: center;
  }

  .noise {
    width: 72px;
    text-align: center;
  }

  .orb {
    width: 68px;
    height: 68px;
    margin: 0 auto;
    border-radius: 50%;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      7px 7px 14px rgba(168, 158, 144, 0.42),
      -5px -5px 12px rgba(255, 252, 248, 0.8);
  }

  .orb.on {
    background: #ded8cf;
    box-shadow:
      inset 5px 5px 9px rgba(150, 140, 126, 0.45),
      inset -4px -4px 8px rgba(255, 252, 248, 0.7);
  }

  .noise p {
    margin: 10px 0 0;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--soft);
  }

  .noise.on p { color: var(--ink); }

  .settings {
    margin: 0;
    font-size: 13px;
    letter-spacing: 0.22em;
    text-indent: 0.22em;
    color: var(--soft);
  }

  .links {
    margin-top: 26px;
    display: flex;
    gap: 36px;
    color: var(--soft);
    font-size: 13px;
    letter-spacing: 0.22em;
  }

  .grow-name {
    margin: 0;
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 0.12em;
  }

  .grow-meta, .hours, .stage, .quiet, .result, .seed p {
    margin: 0;
    color: var(--soft);
    font-size: 13px;
    line-height: 1.7;
    text-align: center;
  }

  .hours {
    margin-top: 8px;
    color: var(--ink);
    font-size: 16px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
  }

  .stage {
    margin-top: 4px;
    letter-spacing: 0.22em;
  }

  .mark {
    color: var(--faint);
    font-size: 11px;
    letter-spacing: 0.08em;
  }

  .plant-art {
    width: 230px;
    height: 230px;
    margin-top: 8px;
  }

  .plant-art.small {
    width: 96px;
    height: 108px;
    margin: 0;
  }

  .shelf-row, .pools {
    display: flex;
    justify-content: center;
    gap: 18px;
    width: 100%;
  }

  .shelf-row {
    margin-top: 22px;
    align-items: flex-end;
    gap: 8px;
  }

  .pair { width: 96px; text-align: center; }
  .pair strong, .pair span {
    display: block;
    font-weight: 400;
    font-size: 12px;
    letter-spacing: 0.04em;
  }
  .pair span { color: var(--soft); margin-top: 2px; }

  .pools { gap: 32px; margin-top: 18px; font-size: 16px; }
  .pools .on { color: var(--ink); }
  .pools .off { color: var(--faint); }

  .odds {
    margin: 18px 0 0;
    color: var(--soft);
    font-size: 13px;
    line-height: 1.8;
    text-align: center;
  }

  .material {
    margin: 16px 0 0;
    font-size: 16px;
    font-variant-numeric: tabular-nums;
  }

  .result {
    margin-top: 16px;
    color: var(--ink);
    font-size: 14px;
  }

  .seed { margin-top: 28px; }
  .seed h3 {
    margin: 0;
    font-size: 16px;
    font-weight: 400;
  }

  .peek {
    height: 236px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-top: 28px;
  }

  .peek .time {
    font-size: 80px;
    margin-top: 12px;
  }

  .sheet {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 608px;
    background: var(--surface);
    border-radius: 36px 36px 48px 48px;
    box-shadow: 0 -16px 28px rgba(168, 158, 144, 0.28);
    padding: 0 36px 32px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .grabber {
    width: 36px;
    height: 4px;
    border-radius: 999px;
    background: #c9c0b4;
    margin: 12px auto 22px;
  }

  .sheet h2 {
    margin: 0;
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 0.08em;
  }

  .sub {
    margin: 12px 0 0;
    color: var(--soft);
    font-size: 14px;
    line-height: 1.7;
  }

  .perk { margin-top: 22px; }

  .perk .k {
    margin: 0;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-indent: 0.2em;
    color: var(--soft);
  }

  .perk .v {
    margin: 5px 0 0;
    font-size: 16px;
    color: var(--ink);
  }

  .price {
    margin: 28px 0 0;
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
  }

  .buy {
    margin-top: 18px;
    width: min(100%, 280px);
    height: 56px;
    border-radius: 28px;
    background: var(--surface);
    box-shadow:
      7px 7px 14px rgba(168, 158, 144, 0.4),
      -5px -5px 12px rgba(255, 252, 248, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
  }

  .restore {
    margin: 18px 0 0;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--soft);
  }

  @media (max-width: 480px) {
    body { padding: 28px 12px 40px; }
    .device { width: min(390px, calc(100vw - 24px)); }
  }
</style>
</head>
<body>
  <header>
    <h1>余白</h1>
    <p>設計の確認です。アプリそのものではありません。購入シートの価格は配置を見るためのもので、アプリ本体は StoreKit の表示を使います。引く画面には、円の金額を置いていません。</p>
  </header>
  <main>
    <figure>
      <div class="device" aria-label="タイマー">
        <div class="screen">
          <div class="spacer top"></div>
          <p class="phase">集中</p>
          <p class="time">24:38</p>
          <div class="streak">
            <strong>4</strong>
            <span>連続</span>
          </div>
          <div class="spacer"></div>
          <div class="play" aria-hidden="true"><i></i><i></i></div>
          <div class="spacer"></div>
          <div class="noises">
            <div class="noise on">
              <div class="orb on"></div>
              <p>白</p>
            </div>
            <div class="noise">
              <div class="orb">
                <svg viewBox="0 0 14 16" width="14" height="16" aria-hidden="true">
                  <path d="M4 7.2V5.3a3 3 0 0 1 6 0v1.9" fill="none" stroke="#6F675E" stroke-width="1.3" stroke-linecap="round"/>
                  <rect x="2.2" y="7" width="9.6" height="7.2" rx="1.6" fill="#6F675E"/>
                </svg>
              </div>
              <p>ピンク</p>
            </div>
            <div class="noise">
              <div class="orb">
                <svg viewBox="0 0 14 16" width="14" height="16" aria-hidden="true">
                  <path d="M4 7.2V5.3a3 3 0 0 1 6 0v1.9" fill="none" stroke="#6F675E" stroke-width="1.3" stroke-linecap="round"/>
                  <rect x="2.2" y="7" width="9.6" height="7.2" rx="1.6" fill="#6F675E"/>
                </svg>
              </div>
              <p>ブラウン</p>
            </div>
            <div class="noise">
              <div class="orb">
                <svg viewBox="0 0 14 16" width="14" height="16" aria-hidden="true">
                  <path d="M4 7.2V5.3a3 3 0 0 1 6 0v1.9" fill="none" stroke="#6F675E" stroke-width="1.3" stroke-linecap="round"/>
                  <rect x="2.2" y="7" width="9.6" height="7.2" rx="1.6" fill="#6F675E"/>
                </svg>
              </div>
              <p>雨</p>
            </div>
          </div>
          <div class="links">
            <span>棚</span>
            <span>引く</span>
            <span>設定</span>
          </div>
        </div>
      </div>
      <figcaption>タイマー</figcaption>
    </figure>

    <figure>
      <div class="device" aria-label="購入">
        <div class="peek">
          <p class="phase">集中</p>
          <p class="time">24:38</p>
        </div>
        <div class="sheet">
          <div class="grabber"></div>
          <h2>余白をひらく</h2>
          <p class="sub">生涯に一度だけの購入です。</p>
          <div class="perk">
            <p class="k">音</p>
            <p class="v">ピンク、ブラウン、雨</p>
          </div>
          <div class="perk">
            <p class="k">時間</p>
            <p class="v">集中と休憩の長さ</p>
          </div>
          <div class="perk">
            <p class="k">連続</p>
            <p class="v">この iPhone に残します</p>
          </div>
          <p class="price">¥4,980</p>
          <div class="buy">購入する</div>
          <p class="restore">購入を復元する</p>
        </div>
      </div>
      <figcaption>購入</figcaption>
    </figure>

    <figure>
      <div class="device" aria-label="育ち">
        <div class="screen">
          <div class="spacer top"></div>
          <p class="grow-name">薄い菊</p>
          <p class="mark">N</p>
          <p class="grow-meta">丸　N</p>
          <svg class="plant-art" viewBox="0 0 230 230" aria-hidden="true">
            <path d="M92 168 C78 188 96 206 115 208 C134 206 154 188 140 168 C132 184 118 190 115 190 C112 190 100 184 92 168 Z" fill="#c4b5a4"/>
            <ellipse cx="116" cy="168" rx="28" ry="7" fill="#b3a696"/>
            <ellipse cx="116" cy="168" rx="16" ry="3.5" fill="#8d8376"/>
            <path d="M116 166 C108 140 96 128 84 118" fill="none" stroke="#7d8a72" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M116 166 C124 142 138 126 152 116" fill="none" stroke="#738268" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M116 166 C112 138 104 118 100 104" fill="none" stroke="#6f8064" stroke-width="1.5" stroke-linecap="round"/>
            <ellipse cx="86" cy="120" rx="11" ry="5" transform="rotate(-28 86 120)" fill="#7d8a72"/>
            <ellipse cx="148" cy="118" rx="11" ry="5" transform="rotate(24 148 118)" fill="#738268"/>
            <ellipse cx="104" cy="108" rx="9" ry="4" transform="rotate(-12 104 108)" fill="#6f8064"/>
          </svg>
          <p class="hours">14.2 / 27.3 時間</p>
          <p class="stage">葉</p>
          <div class="spacer"></div>
        </div>
      </div>
      <figcaption>育ち</figcaption>
    </figure>

    <figure>
      <div class="device" aria-label="棚">
        <div class="screen">
          <p class="grow-name" style="margin-top:28px">棚</p>
          <p class="quiet" style="margin-top:18px">いま、薄い菊が丸で育っています。</p>
          <p class="hours">14.2 / 27.3 時間</p>
          <div class="shelf-row">
            <div class="pair">
              <svg class="plant-art small" viewBox="0 0 112 118" aria-hidden="true">
                <path d="M34 78 L56 34 L78 78 Z" fill="#5f6b58"/>
                <path d="M40 66 L56 28 L72 66 Z" fill="#6d7a64"/>
                <path d="M46 54 L56 22 L66 54 Z" fill="#7b8870"/>
                <path d="M54 86 L58 86 L57 70 L55 70 Z" fill="#8a7d6e"/>
                <path d="M28 92 C32 80 80 80 84 92 C80 100 32 100 28 92 Z" fill="#8e8984"/>
                <ellipse cx="56" cy="90" rx="22" ry="5" fill="#7a756f"/>
              </svg>
              <strong>松</strong>
              <span>石</span>
            </div>
            <div class="pair">
              <svg class="plant-art small" viewBox="0 0 112 118" aria-hidden="true">
                <g fill="#efeae2" transform="translate(56 46)">
                  <ellipse rx="2.4" ry="16" transform="rotate(0)"/>
                  <ellipse rx="2.4" ry="16" transform="rotate(20)"/>
                  <ellipse rx="2.4" ry="16" transform="rotate(40)"/>
                  <ellipse rx="2.4" ry="16" transform="rotate(60)"/>
                  <ellipse rx="2.4" ry="16" transform="rotate(80)"/>
                  <ellipse rx="2.4" ry="16" transform="rotate(100)"/>
                  <ellipse rx="2.4" ry="16" transform="rotate(120)"/>
                  <ellipse rx="2.4" ry="16" transform="rotate(140)"/>
                  <ellipse rx="2.4" ry="16" transform="rotate(160)"/>
                  <ellipse rx="2.2" ry="11" transform="rotate(10)"/>
                  <ellipse rx="2.2" ry="11" transform="rotate(50)"/>
                  <ellipse rx="2.2" ry="11" transform="rotate(90)"/>
                  <ellipse rx="2.2" ry="11" transform="rotate(130)"/>
                  <ellipse rx="2.2" ry="11" transform="rotate(170)"/>
                </g>
                <circle cx="56" cy="46" r="3" fill="#cbbfa6"/>
                <path d="M56 58 L56 84" stroke="#7d8a72" stroke-width="1.4" stroke-linecap="round"/>
                <path d="M38 96 C42 82 70 82 74 96 L70 102 L42 102 Z" fill="#c4b5a4"/>
                <rect x="48" y="100" width="16" height="8" rx="1" fill="#b3a696"/>
              </svg>
              <strong>白菊</strong>
              <span>高台</span>
            </div>
            <div class="pair">
              <svg class="plant-art small" viewBox="0 0 112 118" aria-hidden="true">
                <path d="M34 88 C40 48 78 40 86 70" fill="none" stroke="#738268" stroke-width="1.4" stroke-linecap="round"/>
                <ellipse cx="48" cy="62" rx="4" ry="7" fill="#8d8794"/>
                <ellipse cx="60" cy="54" rx="4" ry="7" fill="#8d8794"/>
                <ellipse cx="72" cy="58" rx="4" ry="7" fill="#918b98"/>
                <ellipse cx="78" cy="70" rx="4" ry="7" fill="#8d8794"/>
                <path d="M46 96 C50 78 66 78 70 96 L66 108 L50 108 Z" fill="#f3efe8" stroke="#cfc6ba" stroke-width="1"/>
                <ellipse cx="58" cy="96" rx="12" ry="3" fill="#e4ddd2"/>
              </svg>
              <strong>藤</strong>
              <span>薄磁</span>
            </div>
          </div>
          <p class="quiet" style="margin-top:22px">咲いた花は、鉢といっしょに残ります。</p>
          <div class="spacer"></div>
        </div>
      </div>
      <figcaption>棚</figcaption>
    </figure>

    <figure>
      <div class="device" aria-label="引く">
        <div class="screen">
          <p class="grow-name" style="margin-top:36px">引く</p>
          <div class="pools">
            <span class="on">鉢</span>
            <span class="off">植物</span>
          </div>
          <p class="odds">N 75%、R 20%、SR 4.5%、SSR 0.5%。同じ稀少度のなかでは、どれも同じ割合です。</p>
          <p class="material">引くもの 2</p>
          <p class="quiet">集中が 60 分たまると、一つ増えます。</p>
          <div class="buy">引く</div>
          <p class="result">細筒を受け取りました。</p>
          <div class="seed">
            <h3>育てるものを足す</h3>
            <p>引くものを三つと、12 時間。育っている花があれば、その時間に足します。</p>
            <p class="quiet" style="margin-top:10px">価格は App Store で表示されます</p>
            <div class="buy">足す</div>
          </div>
          <div class="spacer"></div>
        </div>
      </div>
      <figcaption>引く</figcaption>
    </figure>
  </main>
</body>
</html>
