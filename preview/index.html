<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>余白</title>
<style>
  :root {
    color-scheme: light;
    --surface: #E6E1D8;
    --page: #DDD7CD;
    --ink: #3C3832;
    --soft: #5C564E;
    --faint: #6F675E;
    --dark: #c8bfb3;
    --light: #f4f0ea;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", "Source Han Sans JP", sans-serif;
    font-weight: 400;
    font-synthesis: none;
  }

  body {
    min-height: 100vh;
    padding: 48px 24px 64px;
  }

  header {
    max-width: 34em;
    margin: 0 auto 36px;
    text-align: center;
  }

  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 400;
    letter-spacing: 0.46em;
    text-indent: 0.46em;
  }

  header p {
    margin: 14px 0 0;
    color: var(--soft);
    font-size: 14px;
    line-height: 1.9;
  }

  main {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 56px;
    flex-wrap: wrap;
  }

  figure {
    margin: 0;
  }

  figcaption {
    margin-top: 18px;
    text-align: center;
    color: var(--soft);
    font-size: 13px;
    letter-spacing: 0.22em;
    text-indent: 0.22em;
  }

  .device {
    width: 390px;
    height: 844px;
    background: var(--surface);
    border-radius: 48px;
    position: relative;
    overflow: hidden;
    box-shadow:
      18px 18px 36px #cfc6ba,
      -14px -14px 32px #f7f3ee;
  }

  .screen {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 72px 28px 36px;
  }

  .spacer { flex: 1 1 16px; }
  .spacer.top { flex: 0.7 1 12px; }

  .phase {
    margin: 0;
    font-size: 14px;
    letter-spacing: 0.28em;
    text-indent: 0.28em;
    color: var(--soft);
  }

  .time {
    margin: 18px 0 0;
    font-size: clamp(64px, 22vw, 96px);
    font-weight: 300;
    line-height: 1;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }

  .streak {
    margin-top: 22px;
    text-align: center;
  }

  .streak strong {
    display: block;
    font-size: 20px;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    color: var(--soft);
  }

  .streak span {
    display: block;
    margin-top: 4px;
    font-size: 11px;
    letter-spacing: 0.24em;
    text-indent: 0.24em;
    color: var(--soft);
  }

  .play {
    width: 104px;
    height: 104px;
    border-radius: 50%;
    background: var(--surface);
    box-shadow:
      8px 8px 16px rgba(168, 158, 144, 0.45),
      -6px -6px 14px rgba(255, 252, 248, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }

  .play i {
    width: 5px;
    height: 28px;
    border-radius: 3px;
    background: var(--ink);
    display: block;
  }

  .noises {
    display: flex;
    gap: 12px;
    width: 100%;
    justify-content: center;
  }

  .noise {
    width: 72px;
    text-align: center;
  }

  .orb {
    width: 68px;
    height: 68px;
    margin: 0 auto;
    border-radius: 50%;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      7px 7px 14px rgba(168, 158, 144, 0.42),
      -5px -5px 12px rgba(255, 252, 248, 0.8);
  }

  .orb.on {
    background: #ded8cf;
    box-shadow:
      inset 5px 5px 9px rgba(150, 140, 126, 0.45),
      inset -4px -4px 8px rgba(255, 252, 248, 0.7);
  }

  .noise p {
    margin: 10px 0 0;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--soft);
  }

  .noise.on p { color: var(--ink); }

  .settings {
    margin: 28px 0 0;
    font-size: 13px;
    letter-spacing: 0.22em;
    text-indent: 0.22em;
    color: var(--soft);
  }

  .peek {
    height: 236px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-top: 28px;
  }

  .peek .time {
    font-size: 80px;
    margin-top: 12px;
  }

  .sheet {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 608px;
    background: var(--surface);
    border-radius: 36px 36px 48px 48px;
    box-shadow: 0 -16px 28px rgba(168, 158, 144, 0.28);
    padding: 0 36px 32px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .grabber {
    width: 36px;
    height: 4px;
    border-radius: 999px;
    background: #c9c0b4;
    margin: 12px auto 22px;
  }

  .sheet h2 {
    margin: 0;
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 0.08em;
  }

  .sub {
    margin: 12px 0 0;
    color: var(--soft);
    font-size: 14px;
    line-height: 1.7;
  }

  .perk { margin-top: 22px; }

  .perk .k {
    margin: 0;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-indent: 0.2em;
    color: var(--soft);
  }

  .perk .v {
    margin: 5px 0 0;
    font-size: 16px;
    color: var(--ink);
  }

  .price {
    margin: 28px 0 0;
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
  }

  .buy {
    margin-top: 18px;
    width: min(100%, 280px);
    height: 56px;
    border-radius: 28px;
    background: var(--surface);
    box-shadow:
      7px 7px 14px rgba(168, 158, 144, 0.4),
      -5px -5px 12px rgba(255, 252, 248, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
  }

  .restore {
    margin: 18px 0 0;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--soft);
  }

  @media (max-width: 480px) {
    body { padding: 28px 12px 40px; }
    .device { width: min(390px, calc(100vw - 24px)); }
  }
</style>
</head>
<body>
  <header>
    <h1>余白</h1>
    <p>設計の確認です。アプリそのものではありません。ここに出した価格は配置を見るためのもので、アプリ本体は StoreKit の表示を使います。</p>
  </header>
  <main>
    <figure>
      <div class="device" aria-label="タイマー">
        <div class="screen">
          <div class="spacer top"></div>
          <p class="phase">集中</p>
          <p class="time">24:38</p>
          <div class="streak">
            <strong>4</strong>
            <span>連続</span>
          </div>
          <div class="spacer"></div>
          <div class="play" aria-hidden="true"><i></i><i></i></div>
          <div class="spacer"></div>
          <div class="noises">
            <div class="noise on">
              <div class="orb on"></div>
              <p>白</p>
            </div>
            <div class="noise">
              <div class="orb">
                <svg viewBox="0 0 14 16" width="14" height="16" aria-hidden="true">
                  <path d="M4 7.2V5.3a3 3 0 0 1 6 0v1.9" fill="none" stroke="#6F675E" stroke-width="1.3" stroke-linecap="round"/>
                  <rect x="2.2" y="7" width="9.6" height="7.2" rx="1.6" fill="#6F675E"/>
                </svg>
              </div>
              <p>ピンク</p>
            </div>
            <div class="noise">
              <div class="orb">
                <svg viewBox="0 0 14 16" width="14" height="16" aria-hidden="true">
                  <path d="M4 7.2V5.3a3 3 0 0 1 6 0v1.9" fill="none" stroke="#6F675E" stroke-width="1.3" stroke-linecap="round"/>
                  <rect x="2.2" y="7" width="9.6" height="7.2" rx="1.6" fill="#6F675E"/>
                </svg>
              </div>
              <p>ブラウン</p>
            </div>
            <div class="noise">
              <div class="orb">
                <svg viewBox="0 0 14 16" width="14" height="16" aria-hidden="true">
                  <path d="M4 7.2V5.3a3 3 0 0 1 6 0v1.9" fill="none" stroke="#6F675E" stroke-width="1.3" stroke-linecap="round"/>
                  <rect x="2.2" y="7" width="9.6" height="7.2" rx="1.6" fill="#6F675E"/>
                </svg>
              </div>
              <p>雨</p>
            </div>
          </div>
          <p class="settings">設定</p>
        </div>
      </div>
      <figcaption>タイマー</figcaption>
    </figure>

    <figure>
      <div class="device" aria-label="購入">
        <div class="peek">
          <p class="phase">集中</p>
          <p class="time">24:38</p>
        </div>
        <div class="sheet">
          <div class="grabber"></div>
          <h2>余白をひらく</h2>
          <p class="sub">生涯に一度だけの購入です。</p>
          <div class="perk">
            <p class="k">音</p>
            <p class="v">ピンク、ブラウン、雨</p>
          </div>
          <div class="perk">
            <p class="k">時間</p>
            <p class="v">集中と休憩の長さ</p>
          </div>
          <div class="perk">
            <p class="k">連続</p>
            <p class="v">この iPhone に残します</p>
          </div>
          <p class="price">¥4,980</p>
          <div class="buy">購入する</div>
          <p class="restore">購入を復元する</p>
        </div>
      </div>
      <figcaption>購入</figcaption>
    </figure>
  </main>
</body>
</html>
