<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>余白</title>
  <style>
    :root {
      --surface: #E6E1D8;
      --page: #DDD7CD;
      --ink: #3C3832;
      --soft: #5C564E;
      --faint: #6F675E;
      --inset: #DED8CF;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: "Noto Sans JP", "Hiragino Sans", sans-serif;
    }
    a { color: var(--soft); }
    .phone {
      width: min(420px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      background: var(--surface);
      padding: 28px 22px 36px;
    }
    button, input {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
    }
    button { cursor: pointer; }
    .mark { letter-spacing: 0.45em; text-align: center; color: var(--soft); font-size: 14px; }
    .title { font-size: 28px; font-weight: 300; text-align: center; margin: 8px 0; }
    .lead, .quiet, .result { color: var(--soft); text-align: center; line-height: 1.7; }
    .quiet { font-size: 13px; color: var(--faint); }
    .label { font-size: 12px; letter-spacing: 0.18em; color: var(--faint); margin: 18px 0 8px; }
    .drops { text-align: center; font-size: 22px; font-weight: 300; font-variant-numeric: tabular-nums; }
    .drops.bottom { margin-top: 28px; }
    .wide {
      display: block;
      width: 100%;
      margin: 14px 0;
      padding: 14px 12px;
      border-radius: 18px;
      background: var(--inset);
      box-shadow: 6px 6px 14px rgba(168, 158, 144, 0.35), -4px -4px 10px rgba(255, 252, 248, 0.8);
    }
    .links { display: flex; justify-content: center; gap: 18px; margin-top: 16px; }
    .links button { color: var(--soft); font-size: 13px; }
    .text { display: block; margin: 18px auto; color: var(--soft); }
    .noise { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; gap: 6px; font-size: 12px; color: var(--soft); }
    .dot {
      width: 54px; height: 54px; border-radius: 50%; margin: 0 auto 6px;
      background: var(--surface);
      box-shadow: 6px 6px 12px rgba(168, 158, 144, 0.4), -4px -4px 10px rgba(255, 252, 248, 0.85);
    }
    .dot.on { background: var(--inset); box-shadow: inset 3px 3px 6px rgba(168, 158, 144, 0.35); }
    .choice, .odd, .pack {
      width: 100%;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      margin: 6px 0;
      border-radius: 14px;
      text-align: left;
    }
    .choice.on { background: var(--inset); }
    .odds { margin-top: 8px; }
    .odd span:last-child { width: 72px; text-align: right; font-variant-numeric: tabular-nums; }
    .clock { font-size: 92px; font-weight: 300; text-align: center; margin: 8px 0; font-variant-numeric: tabular-nums; line-height: 1; }
    .phase { text-align: center; letter-spacing: 0.3em; color: var(--soft); font-size: 14px; margin-top: 18px; }
    .play {
      width: 96px; height: 96px; border-radius: 50%; display: block; margin: 8px auto;
      background: var(--surface);
      box-shadow: 7px 7px 16px rgba(168, 158, 144, 0.4), -5px -5px 12px rgba(255, 252, 248, 0.85);
    }
    .back { color: var(--soft); font-size: 13px; }
    .pair { text-align: center; margin-top: 8px; }
    .pair-plant { height: 210px; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
    .pair-plant img, .pot-img { max-width: 220px; object-fit: contain; }
    .marks { display: flex; gap: 2px; justify-content: center; margin-top: 8px; }
    .marks i { width: 6px; height: 6px; border-radius: 50%; background: rgba(111, 103, 94, 0.25); display: block; }
    .marks i.on { background: #5C564E; }
    .pot-img { height: 92px; }
    .pair-title { text-align: center; margin: 8px 0 0; }
    .stem { width: 3px; background: var(--soft); margin: 0 auto; opacity: 0.6; }
    .bowl { width: 120px; height: 36px; border: 1.5px solid var(--soft); border-radius: 0 0 60px 60px; margin: 8px auto; }
    .stem-name { font-size: 12px; color: var(--soft); }
    input {
      width: 100%;
      text-align: center;
      padding: 10px;
      border-radius: 16px;
      background: var(--inset);
    }
    .shelf-row { padding: 10px 0; border-bottom: 1px solid rgba(111, 103, 94, 0.15); }
    .shelf-row p { margin: 0; }
    .modal { position: fixed; inset: 0; background: rgba(60, 56, 50, 0.25); display: flex; align-items: flex-end; justify-content: center; }
    .sheet { width: min(420px, 100%); background: var(--surface); border-radius: 28px 28px 0 0; padding: 24px; text-align: center; max-height: 88vh; overflow: auto; }
    .detail-img { max-width: 100%; max-height: 280px; }
    .audit { padding-left: 18px; font-size: 13px; line-height: 1.6; }
    .pass { color: var(--ink); }
    .fail { color: #8a3b32; }
    .topnote { max-width: 720px; margin: 0 auto; padding: 18px 16px 0; color: var(--soft); font-size: 13px; line-height: 1.7; }
  </style>
</head>
<body>
  <p class="topnote">ブラウザで触れる余白です。名前と絵の対照は <a href="zukan.html">図鑑</a> と <a href="../catalog/CATALOG.md">カタログ</a> にあります。</p>
  <main class="phone" id="app"></main>
  <script src="catalog-data.js"></script>
  <script src="garden.js"></script>
  <script src="app.js"></script>
</body>
</html>
